name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: PHP ${{ matrix.php }} ${{ matrix.ts }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        php: ['8.4', '8.5']
        ts: [nts, zts]

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
        env:
          phpts: ${{ matrix.ts == 'zts' && 'ts' || 'nts' }}

      - name: Build
        run: |
          phpize
          ./configure --enable-posi
          make -j"$(nproc 2>/dev/null || sysctl -n hw.ncpu)"

      - name: Load
        # posi requires ext-posix; -n drops the ini that enables it where PHP ships it as a shared extension.
        run: |
          POSIX=""; php -n -m | grep -qx posix || POSIX="-d extension=posix"
          php -n $POSIX -d extension="$PWD/modules/posi.so" -r 'exit(extension_loaded("posi") ? 0 : 1);'
          php -n $POSIX -d extension="$PWD/modules/posi.so" --ri posi

      - name: Test
        run: |
          composer install --no-interaction --no-progress
          php -d extension="$PWD/modules/posi.so" -d memory_limit=128M vendor/bin/pest --ci
